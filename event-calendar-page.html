<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>イベントカレンダー - Force of the Horse</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">FORCE OF THE HORSE</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-link">TOP</a></li>
                    <li><a href="certified-event-system.html" class="nav-link">公認イベント制度</a></li>
                    <li><a href="event-calendar-page.html" class="nav-link active">イベントカレンダー</a></li>
                    <li><a href="faq.html" class="nav-link">FAQ</a></li>
                </ul>
            </nav>
            <button class="nav-toggle" aria-label="メニュー">☰</button>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-5 py-12">
        <div class="breadcrumb">
            <a href="index.html">TOP</a>
            <span class="breadcrumb-sep">&gt;</span>
            <span>イベントカレンダー</span>
        </div>

        <div class="page-head">
            <p class="page-eyebrow">EVENT CALENDAR</p>
            <h1 class="page-title">イベントカレンダー</h1>
            <p class="page-desc">イベントの開催スケジュールです。</p>
            <div class="legend">
                <span class="legend-item"><span class="legend-dot final"></span>公式大会</span>
                <span class="legend-item"><span class="legend-dot area"></span>公認イベント</span>
                <span class="legend-item"><span class="legend-dot meetup"></span>ショップイベント</span>
            </div>
        </div>
    </div>

    <main class="calendar-page-grid">
        <section class="panel">
            <div class="calendar-header">
                <button class="calendar-nav" id="page-cal-prev" aria-label="前の月">◀</button>
                <span class="calendar-month" id="page-calendar-month"></span>
                <button class="calendar-nav" id="page-cal-next" aria-label="次の月">▶</button>
            </div>
            <div class="calendar-grid" id="page-calendar-grid"></div>
        </section>

        <section class="side-events">
            <div class="month-col">
                <div class="month-col-head">
                    <h2 id="month-event-heading"></h2>
                    <div class="month-nav-group">
                        <button class="calendar-nav month-prev-btn" id="month-list-prev" aria-label="先月のイベントを見る">‹</button>
                        <button class="calendar-nav month-next-btn" id="month-list-next" aria-label="来月のイベントを見る">›</button>
                    </div>
                </div>
                <div id="month-event-list" class="event-accordion"></div>
            </div>
        </section>
    </main>

    <!-- 日付クリックで開くその日のイベント一覧ポップアップ -->
    <div id="day-popup-overlay" class="day-popup-overlay">
        <div class="day-popup-box">
            <div class="day-popup-head">
                <span id="day-popup-date"></span>
                <button type="button" id="day-popup-close" class="day-popup-close" aria-label="閉じる">×</button>
            </div>
            <div id="day-popup-list" class="day-popup-list"></div>
        </div>
    </div>

    <footer>
        <div class="footer-inner">
            <p><a href="privacy.html">プライバシーポリシー</a> ・ ©FRAMELUNCH.INC All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
